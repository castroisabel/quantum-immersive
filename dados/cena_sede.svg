<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdeec9"/><stop offset="1" stop-color="#f7d79c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a866"/><stop offset="1" stop-color="#c4914a"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fbe08a"/><stop offset="1" stop-color="#f2a83a"/>
    </radialGradient>
  </defs>

  <!-- céu e chão -->
  <rect x="0" y="0" width="820" height="400" fill="url(#sky)"/>
  <rect x="0" y="380" width="820" height="140" fill="url(#ground)"/>

  <!-- sol forte -->
  <g>
    <g stroke="#f4b64e" stroke-width="6" stroke-linecap="round" opacity="0.8">
      <line x1="690" y1="30" x2="690" y2="8"/><line x1="750" y1="55" x2="770" y2="40"/>
      <line x1="628" y1="55" x2="610" y2="40"/><line x1="775" y1="105" x2="798" y2="105"/>
      <line x1="605" y1="105" x2="582" y2="105"/>
    </g>
    <circle cx="690" cy="105" r="52" fill="url(#sun)"/>
  </g>

  <!-- fendas no solo seco -->
  <g stroke="#b07f3a" stroke-width="2.5" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M60,430 l40,20 l-15,25"/><path d="M300,470 l50,-18 l30,22"/>
    <path d="M560,440 l45,25 l35,-15"/><path d="M700,485 l40,-20"/>
    <path d="M150,490 l60,-15"/>
  </g>

  <!-- mandacaru (cacto do sertão) -->
  <g fill="#5f8f5b">
    <rect x="118" y="300" width="26" height="110" rx="13"/>
    <path d="M118,345 h-20 a10,10 0 0 0 -10,10 v30 a8,8 0 0 0 16,0 v-24 h14 z"/>
    <path d="M144,330 h20 a10,10 0 0 1 10,10 v40 a8,8 0 0 1 -16,0 v-34 h-14 z"/>
  </g>

  <!-- ADULTO -->
  <g transform="translate(340 250)">
    <!-- pernas -->
    <g stroke="#3a5568" stroke-width="15" stroke-linecap="round"><line x1="-11" y1="95" x2="-13" y2="155"/><line x1="11" y1="95" x2="14" y2="155"/></g>
    <ellipse cx="-14" cy="160" rx="12" ry="6" fill="#33414a"/><ellipse cx="15" cy="160" rx="12" ry="6" fill="#33414a"/>
    <!-- torso -->
    <path d="M-26,22 q26,-14 52,0 l-4,72 h-44 z" fill="#2f8f7f"/>
    <!-- braço direito segurando balde vazio -->
    <g stroke="#c68642" stroke-width="12" stroke-linecap="round" fill="none"><path d="M22,30 q26,10 26,50"/></g>
    <!-- braço esquerdo na testa (protegendo do sol / cansaço) -->
    <g stroke="#c68642" stroke-width="12" stroke-linecap="round" fill="none"><path d="M-22,30 q-22,-6 -8,-40 q6,-10 16,-6"/></g>
    <!-- cabeça -->
    <circle cx="0" cy="-16" r="21" fill="#c68642"/>
    <path d="M-21,-22 a21,21 0 0 1 42,0 q-21,-14 -42,0 z" fill="#4a3524"/>
    <!-- rosto cansado -->
    <circle cx="-7" cy="-16" r="2.4" fill="#3a2a1c"/><circle cx="7" cy="-16" r="2.4" fill="#3a2a1c"/>
    <path d="M-6,-5 q6,-4 12,0" stroke="#7a5433" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- gotas de suor -->
    <path d="M18,-24 q4,6 0,9 q-4,-3 0,-9z" fill="#67b0dd"/>
    <path d="M20,-10 q3,5 0,7 q-3,-2 0,-7z" fill="#67b0dd"/>
    <!-- balde vazio virado (sem água) -->
    <g transform="translate(52 78) rotate(18)">
      <path d="M-14,0 l4,26 h20 l4,-26 z" fill="#aeb6bc" stroke="#8b939a" stroke-width="2"/>
      <path d="M-14,0 a14,4 0 0 0 28,0" fill="#c7ced3"/>
      <path d="M-12,-2 q14,-14 24,0" stroke="#8b939a" stroke-width="2.5" fill="none"/>
    </g>
  </g>

  <!-- CRIANÇA -->
  <g transform="translate(470 300)">
    <g stroke="#3a5568" stroke-width="11" stroke-linecap="round"><line x1="-8" y1="60" x2="-9" y2="100"/><line x1="8" y1="60" x2="10" y2="100"/></g>
    <ellipse cx="-10" cy="104" rx="9" ry="5" fill="#33414a"/><ellipse cx="11" cy="104" rx="9" ry="5" fill="#33414a"/>
    <path d="M-18,16 q18,-10 36,0 l-3,48 h-30 z" fill="#d9743f"/>
    <!-- braço levantando copo vazio, olhando pra cima -->
    <g stroke="#d99a5b" stroke-width="9" stroke-linecap="round" fill="none"><path d="M16,22 q18,-4 20,-26"/></g>
    <g stroke="#d99a5b" stroke-width="9" stroke-linecap="round" fill="none"><path d="M-16,22 q-14,4 -14,26"/></g>
    <!-- copo vazio -->
    <path d="M30,-8 l3,-20 h14 l3,20 z" fill="#cfe3ee" stroke="#9bbccd" stroke-width="2" transform="translate(0 0)"/>
    <!-- cabeça olhando pra cima -->
    <circle cx="0" cy="-10" r="15" fill="#d99a5b"/>
    <path d="M-15,-14 a15,15 0 0 1 30,0 q-15,-11 -30,0 z" fill="#3a2a1c"/>
    <circle cx="-5" cy="-12" r="2" fill="#3a2a1c"/><circle cx="6" cy="-12" r="2" fill="#3a2a1c"/>
    <path d="M-3,-3 q3,3 7,0" stroke="#8a5a34" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M14,-16 q3,5 0,7 q-3,-2 0,-7z" fill="#67b0dd"/>
  </g>

  <!-- legenda -->
  <text x="410" y="500" text-anchor="middle" font-size="17" font-weight="600" fill="#7a5a2e">75 municípios de PE em emergência por seca</text>
</svg>
